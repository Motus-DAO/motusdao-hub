name: Agent tick

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Release settled escrow sessions
        run: |
          curl -fsS -X POST "https://app.motusdao.org/api/agent/tick" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
